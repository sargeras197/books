<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title description">
  <title id="title">Обкладинка книги «Кіберісторії»</title>
  <desc id="description">Цифрова історія з кількома шляхами вибору, що ведуть до різних наслідків.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081b37" />
      <stop offset="1" stop-color="#11102d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e8ff" />
      <stop offset="1" stop-color="#8f78ff" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4c5cff" stop-opacity=".38" />
      <stop offset="1" stop-color="#4c5cff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#background)" />
  <circle cx="460" cy="370" r="290" fill="url(#glow)" />
  <path d="M38 40h524v820H38z" fill="none" stroke="#9bdcff" stroke-opacity=".22" stroke-width="2" />
  <text x="72" y="106" fill="#70eaff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">ІНТЕРАКТИВНА ОНЛАЙН-КНИГА</text>
  <text x="68" y="204" fill="#f3f7ff" font-family="Arial, sans-serif" font-size="59" font-weight="800">КІБЕР</text>
  <text x="68" y="270" fill="#f3f7ff" font-family="Arial, sans-serif" font-size="59" font-weight="800">ІСТОРІЇ</text>
  <text x="72" y="318" fill="#b9c9e8" font-family="Arial, sans-serif" font-size="20">Твій вибір змінює сюжет</text>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 410v75M300 485l-118 84M300 485l118 84M182 569v74M418 569v74M182 643l-60 58M182 643l60 58M418 643l-60 58M418 643l60 58" stroke-width="5" />
    <path d="M242 407h116l-58 84z" fill="#142d55" stroke-width="4" />
    <path d="M300 424l21 8v18c0 17-11 29-21 35-10-6-21-18-21-35v-18z" stroke-width="3" />
  </g>
  <g fill="#101d3c" stroke="url(#accent)" stroke-width="4">
    <circle cx="300" cy="485" r="12" />
    <circle cx="182" cy="569" r="12" />
    <circle cx="418" cy="569" r="12" />
    <circle cx="122" cy="701" r="15" />
    <circle cx="242" cy="701" r="15" />
    <circle cx="358" cy="701" r="15" />
    <circle cx="478" cy="701" r="15" />
  </g>
  <g fill="#70eaff" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="122" y="744">ОБЕРЕЖНО</text>
    <text x="242" y="744">ПЕРЕВІР</text>
    <text x="358" y="744">ВІДПОВІДЬ</text>
    <text x="478" y="744">НАСЛІДКИ</text>
  </g>
  <path d="M72 794h456" stroke="#9bdcff" stroke-opacity=".28" />
  <text x="72" y="830" fill="#c7d5ed" font-family="Arial, sans-serif" font-size="17">Шахрайство · фішинг · цифрові загрози</text>
</svg>
